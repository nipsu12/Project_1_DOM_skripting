<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToiveOstokset - Toivelistasovellus</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <main class="app-container">
      <header class="header-box">
        <h1>ToiveOstokset</h1>
        <p>Omat ostostoiveet samassa paikassa</p>
      </header>

      <section class="input-section">
        <input
          type="text"
          id="product-input"
          placeholder="Lisää uusi tuote..."
          autocomplete="off"
        >
        <button id="add-btn" class="btn btn-add">Lisää</button>
        <button id="save-btn" class="btn btn-save">Tallenna muutokset</button>
      </section>

      <section class="wishlist-box">
        <ul id="wishlist" class="wishlist"></ul>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
